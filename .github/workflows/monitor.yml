
name: Jolijou Deal Hunter

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

concurrency:
  group: jolijou-deal-hunter
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest

    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les dependances
        run: pip install requests

      - name: Scanner Jolijou
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python bot.py

      - name: Sauvegarder les produits
        run: |
          git config user.name "Jolijou Bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/state.json
          git diff --cached --quiet || git commit -m "Update product history"
          git pull --rebase -X theirs origin main
          git push origin HEAD:main
